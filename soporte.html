<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soporte - libraryHub</title>
    <script
      src="https://kit.fontawesome.com/b3f407f311.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body class="pagina-seccion">
    <header>
      <a class="logo" href="index.html">libraryHub</a>
      <a href="login.html">Iniciar sesión</a>
      <a class="boton" href="registro.html">Registrarse</a>
      <button
        class="boton boton-claro boton-tema"
        type="button"
        title="Cambiar tema"
        aria-label="Cambiar tema"
      >
        <img src="img/iconoTema.png" alt="" />
      </button>
    </header>
    <main>
      <section class="caja">
        <h1>Contacto de Soporte</h1>
        <form id="form-soporte">
          <label for="email">Ingrese su mail</label>
          <input type="email" id="email" placeholder="ejemplo@gmail.com" required />
          <label for="consulta">Ingrese su consulta</label>
          <textarea id="consulta" rows="4" cols="50" placeholder="Describe tu consulta aquí..." required></textarea>
          <button class="boton" type="submit">Enviar Consulta</button>
        </form>
      </section>
    </main>
    <footer id="footer-principal">
      <div>
        <h4>Contactanos</h4>
        <p>Email: contacto@libraryhub.com</p>
        <p>Email: soportelibraryhub@gmail.com</p>
      </div>
      <a id="Contácto"> </a>
      <div>
        <h4>Redes Sociales</h4>
        <ul>
          <li>
            <a href="https://www.unlam.edu.ar/"
              ><i class="fa-brands fa-facebook"></i> Facebook</a
            >
          </li>
          <li>
            <a href="https://www.unlam.edu.ar/"
              ><i class="fa-brands fa-instagram"></i> Instagram</a
            >
          </li>
          <li>
            <a href="https://www.unlam.edu.ar/"
              ><i class="fa-brands fa-twitter"></i> Twitter</a
            >
          </li>
        </ul>
      </div>
    </footer>
    <script src="js/funciones/estado.js" defer></script>
    <script src="js/funciones/catalogo.js" defer></script>
    <script src="js/funciones/administracion.js" defer></script>
    <script src="js/funciones/cuenta.js" defer></script>
    <script src="js/funciones/acciones.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
