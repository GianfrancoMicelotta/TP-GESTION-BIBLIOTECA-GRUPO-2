<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión - libraryHub</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="pagina-seccion">
    <header>
      <a class="logo" href="index.html">libraryHub</a>
      <a>¿No tienes cuenta?</a>
      <a class="boton boton-enlace-auth" href="registro.html">Registrarse</a>
      <button
        class="boton boton-claro boton-tema"
        type="button"
        title="Cambiar tema"
        aria-label="Cambiar tema"
      >
        <img src="img/iconoTema.png" alt="" />
      </button>
    </header>

    <main>
      <section class="caja">
        <h1>Iniciar sesión</h1>
        <form id="form-login">
          <label for="usuario">Usuario o correo</label>
          <input
            type="text"
            id="usuario"
            required
            placeholder="Ingrese su usuario o correo"
          />
          <label for="clave">Contraseña</label>
          <input
            type="password"
            id="clave"
            required
            placeholder="Ingrese su contraseña"
          />
          <button class="boton" type="submit">Ingresar</button>
        </form>
        <p id="primer-admin-info">
          ¿Primera instalación?
          <a id="enlace-primer-admin" href="registro-admin.html">Crear el primer administrador</a>
        </p>
        <!-- <p id="credenciales-admin" class="ayuda-credenciales"></p> -->
      </section>
    </main>
    <footer id="footer-chiquito">
      <div>
        <h4>2026 Gestor de Biblioteca - PW1 - 20262C</h4>
      </div>
    </footer>
    <script src="js/funciones/estado.js" defer></script>
    <script src="js/funciones/catalogo.js" defer></script>
    <script src="js/funciones/administracion.js" defer></script>
    <script src="js/funciones/cuenta.js" defer></script>
    <script src="js/funciones/acciones.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
