<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse - libraryHub</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-seccion">
  <header>
    <a class="logo" href="index.html">libraryHub</a>
    <a>¿Ya tienes una cuenta?</a>
    <a class="boton" href="login.html">Iniciar sesión</a>
    <button class="boton boton-claro boton-tema" type="button" title="Cambiar tema" aria-label="Cambiar tema">
    <img src="img/iconoTema.png" alt="">
    </button>
  </header>

  <main>
    <section class="caja">
      <h1>Crear cuenta</h1>
      <form id="form-registro">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" required>
        <label for="correo">Correo</label>
        <input type="email" id="correo" required>
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" required>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" minlength="8" required>
        <label for="clave2">Repetir contraseña</label>
        <input type="password" id="clave2" minlength="8" required>
        <button class="boton" type="submit">Registrarse</button>
      </form>
    </section>
  </main>
  <footer id="footer-chiquito">
         <div>
            <h4>2026 Gestor de Biblioteca - PW1-20262C</h4>
         </div>
  </footer>
  <script src="js/funciones/estado.js" defer></script>
  <script src="js/funciones/catalogo.js" defer></script>
  <script src="js/funciones/administracion.js" defer></script>
  <script src="js/funciones/cuenta.js" defer></script>
  <script src="js/funciones/acciones.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
